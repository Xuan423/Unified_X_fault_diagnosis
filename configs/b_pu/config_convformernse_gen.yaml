args:

  device: cuda
###################### data ##################

  # data_dir: 
  data_dir: 'E:/dataset/generate/PU/' 
  dataset_task: b_pu_generalization
  source: ['PU_N15_M01_F10', 'PU_N15_M07_F04', 'PU_N15_M07_F10']
  target: ['PU_N09_M07_F10']

# model
  model: 'Convoformer_NSE' # 'Resnet' 'WKN_m' 'Sinc_net_m' 'Huan_net' 'TFN_Morlet' 'MCN_GFK'
  skip_connection: true
  num_classes: 4 # 5 for THU_018_basic 4 for THU_006_basic
  in_dim : 4096
  in_channels : 3
# hyperparameter
  learning_rate: 0.001
  batch_size: 32
  num_epochs: 100
  num_workers: 2
  seed: 1

# train
  monitor: 'val_loss'
  patience: 50
  optimizer: 'adamw'
  gpus: 1
  weight_decay: 0.001
  l1_norm: 0.000

  pruning: None # [0.7,0.5,0.01]
  snr: 0
