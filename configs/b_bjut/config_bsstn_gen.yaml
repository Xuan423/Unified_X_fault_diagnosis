args:

  device: cuda
###################### data ##################

  # data_dir: 
  data_dir: 'E:/dataset/generate/BJUT/' 
  dataset_task: b_bjut_generalization
  source: ['BJUT_35Hz_5', 'BJUT_25Hz_5', 'BJUT_30Hz_5']
  target: ['BJUT_20Hz_5']

# model
  model: 'BSSTN_Flex' # 'Resnet' 'WKN_m' 'Sinc_net_m' 'Huan_net' 'TFN_Morlet' 'MCN_GFK'
  skip_connection: true
  num_classes: 5 # 5 for THU_018_basic 4 for THU_006_basic
  in_dim : 4096
  in_channels : 3
# hyperparameter
  learning_rate: 0.001
  batch_size: 32
  num_epochs: 100
  weight_decay: 0.0001
  num_workers: 2
  seed: 1

# train
  monitor: 'val_loss'
  patience: 50
  gpus: 1
  l1_norm: 0.001

  pruning: None # [0.7,0.5,0.01]
  snr: 0
