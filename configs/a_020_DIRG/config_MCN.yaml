args:

  device: cuda
  data_dir: 'E:/dataset/generate/PHMbench_DIRG_020_4096/'
  dataset_task: DIRG_020_basic
  target: 'DIRG_020_100Hz_0N'
  target_list: ['DIRG_020_100Hz_0N', 'DIRG_020_100Hz_1000N', 'DIRG_020_100Hz_1400N', 'DIRG_020_100Hz_1800N', 'DIRG_020_200Hz_0N', 'DIRG_020_200Hz_1000N', 'DIRG_020_200Hz_1400N', 'DIRG_020_200Hz_1800N']

  k_shot: 64

# model
  model: 'MCN_GFK' # 'Resnet' 'WKN_m' 'Sinc_net_m' 'Huan_net' 'TFN_Morlet' 'MCN_GFK'
  skip_connection: true
  num_classes: 7
  in_dim : 4096
  out_dim : 4096
  in_channels : 6
  out_channels : 3
  scale : 4

  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1


# hyperparameter
  learning_rate: 0.01
  batch_size: 64
  num_epochs: 200
  weight_decay: 0.0001
  num_workers: 2
  seed: 17

# train
  monitor: 'val_loss'
  patience: 100
  gpus: 1
  l1_norm: 0.0001

  pruning: None # [0.7,0.5,0.01]
  snr: 0
