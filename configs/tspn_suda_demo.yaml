signal_processing_configs:
  layer1: ["HT", "WF", "I"]
  layer2: ["HT", "WF", "I"]
  layer3: ["HT", "WF", "I"]
  layer4: ["HT", "WF", "I"]

feature_extractor_configs:
  - Mean
  - Std
  - Var
  - Entropy
  - Max
  - Min
  - AbsMean
  - Kurtosis
  - RMS
  - CrestFactor
  - Skewness
  - ClearanceFactor
  - ShapeFactor

args:
  device: cpu
  data_dir: data/demo_tspn/
  dataset_task: TSPN_SUDA_DEMO
  target: SUDA_electric_0kg_2500r_1000Hz

  model: TSPN
  skip_connection: true
  num_classes: 4
  in_dim: 1024
  out_dim: 1024
  in_channels: 5
  out_channels: 3
  scale: 4

  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1

  learning_rate: 0.001
  batch_size: 32
  num_epochs: 20
  weight_decay: 0.0001
  num_workers: 0
  pin_memory: false
  seed: 17

  monitor: val_loss
  patience: 20
  gpus: 1
  l1_norm: 0.0001
  pruning: null
  log_parameters: false
